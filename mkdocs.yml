site_name: Entrega
site_author: Ycakraft
repo_url: https://github.com/Ycakraft/Portfolio-de-Machine-Learning
repo_name: Machine-Learning---Atividades

theme:
  name: material
  palette:
    # --- PALETA ATUALIZADA ---

    # Paleta para o Modo Escuro (Padrão)
    - scheme: slate
      primary: black      # Header e navegação em preto profundo
      accent: orange      # Cor de destaque vibrante
      toggle:
        icon: material/brightness-7 # Ícone de Sol
        name: Mudar para modo claro

    # Modo Claro (Opcional)
    - scheme: default
      primary: white      # Fundo branco para o modo claro
      accent: orange      # MANTÉM O LARANJA para consistência da marca
      toggle:
        icon: material/brightness-4 # Ícone de Lua
        name: Mudar para modo escuro
    # --- FIM DA PALETA ---

  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
    
    # --- 🚀 RECURSOS FUTURISTAS ---
    - navigation.tabs           # <--- NOVO: Navegação principal em Abas
    - navigation.tabs.sticky    # <--- NOVO: Fixa as abas no topo
    - header.autohide           # <--- NOVO: Esconde o header ao rolar
    - navigation.prune          # <--- NOVO: Limpa a sidebar (menu lateral)
    - toc.follow                # <--- NOVO: Acompanha a rolagem no índice
    
  icon:
    logo: material/alpha-y-box-outline # <--- NOVO: Logo "Y" (de YC)
    
    # --- ÍCONES MAIS BONITOS (Material) ---
    admonition:
      note: material/note-outline
      abstract: material/text-search
      info: material/information-outline
      tip: material/lightbulb-outline
      success: material/check-circle-outline
      question: material/help-circle-outline
      warning: material/alert-outline
      failure: material/close-circle-outline
      danger: material/skull-outline
      bug: material/bug-outline
      example: material/beaker-outline
      quote: material/format-quote-open-outline

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - markdown_grid_tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: python
          class: python
          validator: !!python/name:markdown_exec.validator
          format: !!python/name:markdown_exec.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true   
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - tables
      
plugins:
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - git-committers:
      repository: EnricoDiGioia/EnricoDiGioia.github.com
      branch: main
  - search
  - badges
  - minify:
      minify_html: true
  - markdown-exec
  - render_swagger:
      allow_arbitrary_locations : true
  - termynal:
      prompt_literal_start:
        - "$"
        - ">"

extra_javascript:
  - https://unpkg.com/mathjax/es5/tex-mml-chtml.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js
  - https://unpkg.com/aos@next/dist/aos.js 
  - assets/js/init_aos.js
  - https://unpkg.com/aos@next/dist/aos.css


  

nav:
  - Home: index.md
  - Projeto: ./projeto/main.md
  - Atividades do Ycaro:
    - Decision Tree: ./Decision Tree/main.md
    - KNN: ./KNN/main.md
    - K-Mean: ./K-Mean/main.md
    - Random Forest: ./Random Forest/main.md
    - Pyspark: ./Pyspark/main.md
    - Page Rank: ./Page Rank/main.md